####################################################################################
# Minecraft Version Configuration
#
# This config describes the Minecraft Versions compatible with Lunar Client.
# It is written in HOCON (download the IntelliJ plugin for syntax highlighting).
####################################################################################

# Common default values for all versions
version {
  snapshot: false
  private-in-launcher: false
  # OptiFine version to use
  optifine: null
  # whether or not the OF jar uses the namespaced format with separate folders for
  # SRG-mapped and notch-mapped classes
  optifine-namespaced-jar: false
  external-manifest: null
  # could potentially be changed in the future
  launch-class: "net.minecraft.client.main.Main"
  # The latest versions of Minecraft >= 1.17 use the OpenGL Core Profile.
  # By switching to this profile, many features, including the fixed function pipeline, have become deprecated / removed.
  core-opengl: false
  # mainly used for Realms
  latest: false
  # gradle version module compatible with this version
  # null defaults to the ID of the version
  version-module: null
  # is this minor version the default for the major version group?
  default-minor-version: false
  # display to use in the launcher and other places
  # defaults to the exact version
  display-name: null
  disabled: false
  deobfuscated: false
}

commonDependencies: [
  # Rewind
  "org.lwjgl:lwjgl-opus:3.3.3",
  "org.lwjgl:lwjgl-opus:3.3.3:natives-windows",
  "org.lwjgl:lwjgl-opus:3.3.3:natives-linux",
  "org.lwjgl:lwjgl-opus:3.3.3:natives-linux-arm64",
  "org.lwjgl:lwjgl-opus:3.3.3:natives-macos",
  "org.lwjgl:lwjgl-opus:3.3.3:natives-macos-arm64",

  "org.lwjgl:lwjgl-lz4:3.3.3",
  "org.lwjgl:lwjgl-lz4:3.3.3:natives-windows",
  "org.lwjgl:lwjgl-lz4:3.3.3:natives-linux",
  "org.lwjgl:lwjgl-lz4:3.3.3:natives-linux-arm64",
  "org.lwjgl:lwjgl-lz4:3.3.3:natives-macos",
  "org.lwjgl:lwjgl-lz4:3.3.3:natives-macos-arm64",

  "org.lwjgl:lwjgl-zstd:3.3.3",
  "org.lwjgl:lwjgl-zstd:3.3.3:natives-windows",
  "org.lwjgl:lwjgl-zstd:3.3.3:natives-linux",
  "org.lwjgl:lwjgl-zstd:3.3.3:natives-linux-arm64",
  "org.lwjgl:lwjgl-zstd:3.3.3:natives-macos",
  "org.lwjgl:lwjgl-zstd:3.3.3:natives-macos-arm64",
]

# Parent structures for different kinds of versions
legacy: ${version} {
  type: legacy
  java-version: 17
  version-module: "legacy"
}

modern: ${version} {
  type: modern
  version-module: "modern"
  core-opengl: true
  optifine-namespaced-jar: true
}

modern-17: ${modern} {
  java-version: 17
}

modern-21: ${modern} {
  java-version: 21
}

modern-25: ${modern} {
  java-version: 25
}

